[project]
name = "tarsk"
version = "0.1.0"
description = "Memory-bounded task queue for Python with a Rust runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rahmad Afandi", email = "rahmadafandiii@gmail.com" }]
# Two groups. The first is what someone types when they want this category at
# all — celery and taskiq both carry "distributed", and neither hyphenates, so
# the singular words are here beside the compound ones people also try.
# The second is the problem this exists for, spelled the way it is searched:
# nobody with a leaking worker searches "memory", they search OOMKilled.
keywords = [
    "task-queue", "queue", "tasks", "jobs", "background-jobs", "worker",
    "distributed", "async", "scheduler", "cron",
    "memory-limit", "oom", "rss", "redis", "postgres", "rust",
]
dependencies = ["msgpack>=1.0"]

classifiers = [
    # Pre-release, and the trove classifier is the one place people look first.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    # Each of these runs the test suite in CI. Windows runs the two suites that
    # do not need a broker, because neither Redis nor Postgres ships for it.
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/rahmadafandi/tarsk"
Source = "https://github.com/rahmadafandi/tarsk"
Issues = "https://github.com/rahmadafandi/tarsk/issues"

[project.scripts]
tarsk = "tarsk._cli:main"

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "tarsk._core"
python-source = "."
features = ["pyo3/extension-module"]
# Ship the marker: the annotations are useless to a caller without it.
include = [{ path = "tarsk/py.typed", format = "sdist" }]
