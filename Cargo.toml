[package]
name = "tarsk"
version = "0.1.2"
license = "MIT"
description = "Memory-bounded task queue for Python with a Rust runtime"
repository = "https://github.com/rahmadafandi/tarsk"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2.189"
# abi3-py311 matches requires-python: one wheel per platform instead of one
# per Python minor (spec §8). On a free-threaded interpreter pyo3 falls back
# to a version-specific build on its own, which is the cp314t wheel we want.
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py311"] }
# tls-rustls rather than native-tls: a manylinux wheel cannot depend on
# whatever OpenSSL the build host happened to have. `insecure` only does
# anything when a URL asks for it with #insecure — see docs on rediss://.
redis = { version = "1.5.0", features = [
    "tokio-comp",
    "streams",
    "tokio-rustls-comp",
    "tls-rustls-insecure",
] }
# Not used directly — present to pick rustls's crypto provider, which redis
# leaves unselected. ring over aws-lc-rs: the latter wants cmake and a C
# compiler, which a manylinux wheel build should not need.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rmpv = "1.3.1"
sysinfo = "0.38.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "signal"] }
tokio-postgres = "0.7.18"
# Same reasoning as the Redis TLS above: rustls rather than native-tls so a
# manylinux wheel does not depend on the build host's OpenSSL, ring rather than
# aws-lc-rs so it does not want cmake, and the system trust store so
# sslmode=verify-full has roots to verify against.
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = [
    "ring",
    "native-certs",
] }
# tokio runtime explicitly: without a runtime feature lapin fails at connect
# with NoDefaultRuntime. ring + native certs to match the rustls posture the
# redis and postgres sides already ship.
lapin = { version = "4.10.0", default-features = false, features = ["tokio", "rustls--ring", "rustls-native-certs"] }
