[package]
name = "tarsk"
version = "0.1.0"
license = "MIT"
description = "Memory-bounded task queue for Python with a Rust runtime"
repository = "https://github.com/rahmadafandi/tarsk"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2.189"
# abi3-py311 matches requires-python: one wheel per platform instead of one
# per Python minor (spec §8). On a free-threaded interpreter pyo3 falls back
# to a version-specific build on its own, which is the cp314t wheel we want.
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py311"] }
redis = { version = "1.5.0", features = ["tokio-comp", "streams"] }
rmpv = "1.3.1"
sysinfo = "0.38.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync", "signal"] }
tokio-postgres = "0.7.18"
