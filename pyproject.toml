[project]
name = "tarsk"
version = "0.1.0"
description = "Memory-bounded task queue for Python with a Rust runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rahmad Afandi", email = "rahmadafandiii@gmail.com" }]
keywords = [
    "task-queue", "queue", "tasks", "jobs", "background-jobs", "worker",
    "distributed", "async", "scheduler", "cron",
    "rss", "redis", "postgres", "rust",
]
dependencies = ["msgpack>=1.0"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/rahmadafandi/tarsk"
Source = "https://github.com/rahmadafandi/tarsk"
Documentation = "https://rahmadafandi.github.io/tarsk/"
Issues = "https://github.com/rahmadafandi/tarsk/issues"

[project.scripts]
tarsk = "tarsk._cli:main"

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "tarsk._core"
python-source = "."
features = ["pyo3/extension-module"]
include = [{ path = "tarsk/py.typed", format = "sdist" }]
