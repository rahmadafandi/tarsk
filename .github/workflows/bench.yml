name: bench

# Manual only. A benchmark on a shared runner is worth running when you want it,
# not on every push: it takes about twenty minutes and its absolute numbers are
# not comparable between runs on different machines.
on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "scenarios to run, space separated (empty = all)"
        required: false
        default: ""
      refs:
        description: "tags or commits to measure against each other on this one machine (empty = this checkout only)"
        required: false
        default: ""

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Report the machine
        # Every absolute number below depends on these. A run with a different
        # core count is a different experiment, not a later data point.
        run: |
          echo "cores: $(nproc)"
          free -m | sed -n 2p
          lscpu | grep -E "Model name|MHz" || true

      - name: Install Redis
        # Only Redis: no bench scenario touches Postgres, and the tests that do
        # are not what this workflow runs. The harness starts its own instance
        # on its own port, so the one apt starts is stopped to keep it out of
        # the way.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          sudo systemctl stop redis-server || true

      - name: Allow a memory-limited scope
        # The runner is started from a service and has no user session bus, so
        # `systemd-run --user` fails. The harness falls back to `sudo -n`, which
        # is available here; this step only proves it before twenty minutes of
        # work rather than after.
        run: |
          sudo -n systemd-run --scope -q -p MemoryMax=64M -p MemorySwapMax=0 -- true
          echo "memory-limited scopes work"

      - name: Build the extension
        if: inputs.refs == ''
        run: |
          python -m venv .venv
          # packaging: kombu's Redis transport imports it and does not ask for it.
          .venv/bin/pip install -q maturin celery taskiq taskiq-redis redis packaging
          .venv/bin/maturin develop --release -F redis
          # What was measured against: the results page names these.
          .venv/bin/pip freeze | grep -iE "^(celery|kombu|taskiq|taskiq-redis|redis)=="
          redis-server --version

      - name: Run the benchmark
        if: inputs.refs == ''
        # pipefail: through `tee` alone, a harness that crashed was a green run
        # with an empty report.
        run: |
          set -o pipefail
          .venv/bin/python bench/run.py ${{ inputs.scenarios }} | tee bench-output.md

      - name: Measure several versions on this one machine
        # Two runs on two runners cannot say whether the code changed or the
        # machine did. Each ref is built in its own worktree and runs its own
        # harness, in turn and twice over, so a difference between them that
        # is not also a difference between the rounds is the code's.
        if: inputs.refs != ''
        run: |
          set -o pipefail
          for ref in ${{ inputs.refs }}; do
            git worktree add -q "../ref-$ref" "$ref"
            ( cd "../ref-$ref"
              python -m venv .venv
              .venv/bin/pip install -q maturin celery taskiq taskiq-redis redis packaging
              # Before 0.2 the Redis backend was not a feature to ask for.
              .venv/bin/maturin develop --release -F redis || .venv/bin/maturin develop --release )
          done
          for round in 1 2; do
            for ref in ${{ inputs.refs }}; do
              echo "## $ref, round $round" | tee -a bench-output.md
              ( cd "../ref-$ref" && .venv/bin/python bench/run.py ${{ inputs.scenarios }} ) | tee -a bench-output.md
            done
          done

      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.sha }}
          path: bench-output.md
