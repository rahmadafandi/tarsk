name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.14t from day one (spec §7). It is not the default path — the memory
        # guarantee comes from processes, not threads — but a free-threading
        # break should show up here rather than in someone's deploy.
        python: ["3.11", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The broker tests start their own servers on free ports; these are just
      # the binaries. Postgres ships with the runner image.
      # rabbitmq-server starts on install, guest/guest on localhost — exactly
      # what test_amqp probes for. Without it that test skips, and a skipped
      # backend is not a tested one however honestly the summary says so.
      - run: sudo apt-get update && sudo apt-get install -y redis-server rabbitmq-server

      # A venv so `maturin develop` puts the extension in the source tree,
      # which is where the tests add ROOT to sys.path expects to find it.
      - run: python -m venv .venv
      - run: .venv/bin/pip install --upgrade pip maturin msgpack
      # -F: pyproject.toml is the `tarsk` distribution now, which is memory
      # only. The source tree is where every backend is tested, so it gets all
      # of them — the per-distribution wheels are built in `distributions`.
      - run: .venv/bin/maturin develop --release -F redis,postgres,amqp

      - run: .venv/bin/python tests/test_ipc.py
      - run: .venv/bin/python tests/test_recycle.py
      - run: .venv/bin/python tests/test_brokers.py

      # The definition of done, at a length CI can afford. Exits non-zero if a
      # single task went missing.
      - run: .venv/bin/python demo/run.py --minutes 1 --ceiling 150MB --rate 30

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Default features are memory-only now, so the backends need naming or
      # CI would stop compiling three quarters of broker.rs.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --lib
      - run: cargo test --lib --all-features

  test-macos:
    # The wheel has been built for macOS since the first CI commit and nothing
    # had ever run there, so "Linux and macOS" in pyproject.toml was a guess.
    # Everything platform-specific here is a candidate: RSS accounting through
    # sysinfo, ru_maxrss being bytes rather than kilobytes, and the spawn and
    # socket paths.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Redis and Postgres
        run: |
          brew install -q redis postgresql@16
          # The harness starts its own instances and finds initdb by globbing
          # Homebrew's opt directory, so nothing needs to be on PATH or running.
          brew services stop redis 2>/dev/null || true
      - name: Build and test
        run: |
          python -m venv .venv
          .venv/bin/pip install -q maturin msgpack
          .venv/bin/maturin develop --release -F redis,postgres,amqp
          .venv/bin/python tests/rss_probe.py
          .venv/bin/python tests/test_ipc.py
          .venv/bin/python tests/test_recycle.py
          .venv/bin/python tests/test_brokers.py

  test-windows:
    # No Redis and no Postgres: neither ships for Windows, so this runs the two
    # suites that use the in-process memory broker. That still exercises the
    # part that is actually different — spawning a child, the named pipe, the
    # protocol, RSS accounting and the recycling ceiling.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -q maturin msgpack
          .venv\Scripts\maturin develop --release

      # One step per script, because pwsh only hands the job the exit code of
      # the *last* line of a run block. Held together, rss_probe could print
      # FAIL and test_ipc could die outright and the run would still be graded
      # on test_recycle alone — which is how the probe failed unnoticed while
      # this job was green. Bash gets this right with -e; pwsh does not.
      - run: .venv\Scripts\python tests/rss_probe.py
      - run: .venv\Scripts\python tests/test_ipc.py
      - run: .venv\Scripts\python tests/test_recycle.py

  distributions:
    # The four PyPI distributions, each built and then made to run a task from
    # a venv that holds nothing else. The failure this split introduces is a
    # wheel that installs perfectly and has no broker inside it, and no build
    # log catches that — packaging/smoke.py asks the binary.
    #
    # One job with a loop rather than a matrix: the toolchain and the cargo
    # cache are set up once, the three brokers start once, and every variant
    # still reports for itself because the loop collects failures instead of
    # stopping at the first.
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tarsk
          POSTGRES_PASSWORD: tarsk
          POSTGRES_DB: tarsk
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install maturin

      - name: Build each distribution and run a task through it
        run: |
          set -u
          broken=""
          for backend in memory redis postgres amqp; do
            echo "::group::$backend"
            python packaging/variant.py "$backend"
            maturin build --release --out "dist/$backend"
            python packaging/variant.py memory
            case $backend in
              memory)   url=memory:// ;;
              redis)    url=redis://127.0.0.1:6379/0 ;;
              postgres) url=postgres://tarsk:tarsk@127.0.0.1:5432/tarsk ;;
              amqp)     url=amqp://guest:guest@127.0.0.1:5672/%2f ;;
            esac
            python -m venv "/tmp/venv-$backend"
            "/tmp/venv-$backend/bin/pip" install --quiet "dist/$backend"/*.whl
            # From /tmp: at the repository root `import tarsk` would find the
            # source tree and test nothing about the wheel.
            ( cd /tmp && TARSK_SMOKE_BACKEND=$backend TARSK_SMOKE_URL=$url \
                "/tmp/venv-$backend/bin/python" "$GITHUB_WORKSPACE/packaging/smoke.py" ) \
              || broken="$broken $backend"
            echo "::endgroup::"
          done
          if [ -n "$broken" ]; then
            echo "::error::these distributions do not work:$broken"
            exit 1
          fi

      - name: Two of them installed at once must refuse to import
        run: |
          /tmp/venv-redis/bin/pip install --quiet dist/memory/*.whl
          if ( cd /tmp && /tmp/venv-redis/bin/python -c "import tarsk" ) 2>/tmp/clash.log; then
            echo "::error::tarsk imported with two distributions installed"
            exit 1
          fi
          cat /tmp/clash.log
          grep -q "tarsk distributions are installed" /tmp/clash.log

      # The build must leave pyproject.toml on the committed `tarsk` form; a
      # variant left behind is how the wrong name reaches PyPI.
      - run: python packaging/variant.py --check

  wheels:
    # Proves the matrix builds; publishing is a separate, deliberate step.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Two of the four distributions per target, not all four: `tarsk` has
        # no TLS stack at all and `tarsk-redis` has the one that breaks per
        # target — rustls, ring, and ring's ARM assembly. Postgres and AMQP
        # differ from redis in the pure-Rust driver above that, which the
        # `distributions` job builds on every push and release.yml builds for
        # every target. Eight cross-compiles a push is the sane end of this.
        variant: [memory, redis]
        target: [x86_64, aarch64, universal2-apple-darwin, x64]
        include:
          - { target: x86_64, os: ubuntu-24.04 }
          # aarch64 cross-compiles through zig rather than the manylinux
          # container's toolchain. rustls pulls in ring, whose ARM assembly the
          # container's assembler rejects with `#error "ARM assembler must
          # define __ARM_ARCH"`. zig cc gets the target flags right; verified by
          # building this wheel on an x86_64 host before it was written here.
          - { target: aarch64, os: ubuntu-24.04, zig: true }
          - { target: universal2-apple-darwin, os: macos-14 }
          - { target: x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Name the distribution
        run: python packaging/variant.py ${{ matrix.variant }}
      - name: Provide zig
        if: matrix.zig
        # maturin looks for a `zig` binary on PATH; the pip package is a Python
        # module, so it needs a shim.
        run: |
          python -m pip install --quiet ziglang
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec %s -m ziglang "$@"\n' "$(which python)" > "$HOME/.local/bin/zig"
          chmod +x "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist ${{ matrix.zig && '--zig' || '' }}
          # zig cross-compiles on the host and tags the wheel manylinux itself,
          # so the container would only get in the way of finding it.
          container: ${{ matrix.zig && 'off' || 'auto' }}
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.variant }}-${{ matrix.os }}-${{ matrix.target }}
          path: dist
