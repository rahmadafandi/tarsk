name: release

# Started from `maturin generate-ci github --platform all`, then cut down. What
# changed from the generated file, and why, is in the comments below — the
# generator does not know what this project links against or what it needs at
# runtime, and two of its defaults would have shipped wheels that cannot work.
#
# Tags only. `ci.yml` already builds a four-target smoke matrix on every push;
# this one is the full set and the publish, and both are wasted on a branch.
on:
  push:
    # Both spellings. The first tag written for this project was `0.1.0`, the
    # trigger only listened for `v*`, and the push went nowhere — a release
    # that silently does not happen is a worse failure than one that stops
    # with a message.
    tags: ["v[0-9]*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Before ten wheels are built and before anything can reach PyPI, because
    # PyPI does not allow a version to be uploaded twice: publishing 0.1.0
    # under a tag that says something else cannot be taken back.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The tag must match the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          declared=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          tagged=${GITHUB_REF_NAME#v}
          echo "pyproject says $declared, tag says $tagged"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $declared in pyproject.toml"
            exit 1
          fi
      # And it must be the committed `tarsk` form: a variant left behind by a
      # local build would publish four distributions under one name.
      - run: python3 packaging/variant.py --check

  build:
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every distribution for every target: this is the product, and a
        # missing tarsk-amqp aarch64 wheel is a user compiling from sdist on a
        # machine with no Rust. ci.yml keeps the per-push matrix small; this
        # one runs on a tag.
        variant: [memory, redis, postgres, amqp]
        target: [x86_64, aarch64, x86_64-musl, universal2-apple-darwin, x64]
        include:
          - { target: x86_64, os: ubuntu-24.04, manylinux: auto }
          # aarch64 cross-compiles through zig rather than the manylinux
          # container's toolchain. rustls pulls in ring, whose ARM assembly the
          # container's assembler rejects with `#error "ARM assembler must
          # define __ARM_ARCH"`.
          #
          # `maturin generate-ci --zig` does exist and adds the flag, but it
          # leaves the container on; only `container: off` is the form this
          # repository has actually built an aarch64 wheel with. Whether the
          # generated combination also works here is untested, which is the
          # only reason it is not used.
          - { target: aarch64, os: ubuntu-24.04, manylinux: auto, zig: true }
          # A separate target name rather than a second x86_64 row: with the
          # variant dimension above, two rows for one target key would collide
          # instead of expanding.
          - { target: x86_64-musl, os: ubuntu-24.04, manylinux: musllinux_1_2, build: x86_64 }
          - { target: universal2-apple-darwin, os: macos-14 }
          - { target: x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Name the distribution
        run: python packaging/variant.py ${{ matrix.variant }}
      - name: Provide zig
        if: matrix.zig
        # maturin looks for a `zig` binary on PATH; the pip package is a Python
        # module, so it needs a shim.
        run: |
          python -m pip install --quiet ziglang
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec %s -m ziglang "$@"\n' "$(which python)" > "$HOME/.local/bin/zig"
          chmod +x "$HOME/.local/bin/zig"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.build || matrix.target }}
          args: --release --out dist ${{ matrix.zig && '--zig' || '' }}
          # zig cross-compiles on the host and tags the wheel manylinux itself,
          # so the container would only get in the way of finding it.
          container: ${{ matrix.zig && 'off' || 'auto' }}
          manylinux: ${{ matrix.manylinux }}
          sccache: true
      - name: Build the free-threaded wheel
        # abi3 stops at the GIL: a free-threaded build cannot use the stable
        # ABI, so 3.14t needs a wheel of its own or its users compile from the
        # sdist. CI has tested 3.14t since the first commit, and shipping
        # without this would have been a supported version with no wheel.
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.build || matrix.target }}
          args: --release --out dist -i python3.14t ${{ matrix.zig && '--zig' || '' }}
          container: ${{ matrix.zig && 'off' || 'auto' }}
          manylinux: ${{ matrix.manylinux }}
          sccache: true
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.variant }}-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [memory, redis, postgres, amqp]
    steps:
      - uses: actions/checkout@v7
      # One per distribution: each sdist carries its own pyproject.toml, so
      # the one PyPI hands to a platform with no wheel builds that backend and
      # not another.
      - name: Name the distribution
        run: python packaging/variant.py ${{ matrix.variant }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.variant }}-sdist
          path: dist

  publish:
    needs: [build, sdist]
    runs-on: ubuntu-24.04
    strategy:
      # One upload per project: PyPI scopes a trusted-publishing token to a
      # single project, so four distributions cannot go in one call.
      #
      # fail-fast off, and deliberately. If tarsk-redis fails to upload,
      # tarsk-postgres should still go: PyPI refuses a version twice, so the
      # legs that succeeded are done forever and only the failed one needs a
      # re-run. Stopping the others would leave the same partial release with
      # more work to finish it.
      fail-fast: false
      matrix:
        include:
          - { dist: tarsk, variant: memory }
          - { dist: tarsk-redis, variant: redis }
          - { dist: tarsk-postgres, variant: postgres }
          - { dist: tarsk-amqp, variant: amqp }
    environment:
      # One environment per distribution, and not for tidiness: PyPI keys a
      # trusted publisher on (owner, repository, workflow, environment) and
      # refuses to register two pending publishers that share one. All four
      # legs here are the same owner, repository and workflow, so the
      # environment is the only field left to tell them apart. A shared `pypi`
      # rejects the second registration with "already been registered for a
      # different project name", and leaving it blank collides the same way
      # while also giving up the protection rules an environment can carry.
      name: pypi-${{ matrix.dist }}
      url: https://pypi.org/p/${{ matrix.dist }}
    permissions:
      # Trusted publishing, so there is no API token in this repository to
      # rotate or leak. PyPI has to know about this workflow first: each of the
      # four project names needs its own pending publisher naming this
      # repository, `release.yml`, and its own `pypi-<dist>` environment above.
      # Renaming this file, or an environment, breaks the link for that
      # distribution.
      id-token: write
      # For the artifact attestation.
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-${{ matrix.variant }}-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      # Pinned to the full version: setup-uv stopped publishing a moving
      # major tag after v7, so @v10 does not resolve.
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Publish to PyPI
        # Only a tag publishes. A manual run builds every wheel and attests
        # them, which is the rehearsal worth having before the first release.
        if: startsWith(github.ref, 'refs/tags/')
        # `always` rather than the `automatic` default: automatic falls back
        # to looking for a token and would fail with a credentials error
        # instead of saying the publisher is not configured.
        run: uv publish --trusted-publishing always dist/*

  announce:
    # A job of its own, and deliberately: publishing to PyPI cannot be done
    # twice — PyPI refuses a version it already holds — while writing the
    # GitHub release can be redone as often as it takes.
    #
    # Releasing 0.1.3 is what taught this. Every wheel built, `uv publish`
    # succeeded, and then the release step hit a transient GitHub API timeout
    # ("We couldn't respond to your request in time"). With both in one job
    # the run was marked failed even though the package was already on PyPI,
    # and the only re-run on offer would have re-attempted the publish and
    # failed on the duplicate — so the release had to be finished by hand.
    #
    # Split, the failure is re-runnable on its own and touches nothing that
    # has already happened. `overwrite_files` is what makes that re-run
    # idempotent rather than a second error about assets that already exist.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          overwrite_files: true
          # GitHub's Packages panel only ever lists GitHub's own registries, so
          # a PyPI release is invisible on the repository page unless something
          # says so. The generated changelog is appended under this.
          body: |
            One distribution per broker, and only one of them at a time —
            they all install `tarsk` and `tarsk._core`, so installing two
            leaves you running whichever pip unpacked last.

            ```bash
            pip install tarsk==${{ github.ref_name }}           # memory broker only
            pip install tarsk-redis==${{ github.ref_name }}     # + Redis Streams
            pip install tarsk-postgres==${{ github.ref_name }}  # + Postgres
            pip install tarsk-amqp==${{ github.ref_name }}      # + RabbitMQ
            ```

            [PyPI](https://pypi.org/project/tarsk/${{ github.ref_name }}/) ·
            [Documentation](https://rahmadafandi.github.io/tarsk/) ·
            [Benchmarks](https://rahmadafandi.github.io/tarsk/benchmarks)

            Wheels below are built and attested by this workflow, for each of the
            four distributions: Linux glibc and musl on x86_64 and aarch64, macOS
            universal2, Windows x64, for Python 3.11 through 3.14 plus a separate
            free-threaded 3.14t wheel.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
